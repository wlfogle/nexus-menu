<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Menu Entry Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Menu Entry Finder</h1>
    <nav aria-label="Sections">
      <button type="button" class="tab" data-tab="missing" aria-selected="true">Missing</button>
      <button type="button" class="tab" data-tab="created" aria-selected="false">Created</button>
      <button type="button" class="tab" data-tab="prefixes" aria-selected="false">Prefixes</button>
    </nav>
    <button type="button" id="rescan">Rescan</button>
  </header>

  <div id="banner" hidden></div>
  <div id="error" role="alert" hidden></div>

  <main>
    <section id="tab-missing" aria-label="Applications with no menu entry">
      <p id="summary" class="muted"></p>
      <div class="toolbar">
        <input id="filter" type="search" placeholder="Filter by name, source or location" aria-label="Filter">
        <button type="button" id="sel-all">Select all</button>
        <button type="button" id="sel-none">Select none</button>
      </div>
      <div id="list" class="list"></div>
      <div class="actions">
        <label><input type="checkbox" id="dry"> Dry run (write nothing)</label>
        <label><input type="checkbox" id="force"> Overwrite existing entries</label>
        <span id="count" class="muted"></span>
        <button type="button" id="create" class="primary" disabled>Create selected</button>
      </div>
      <div id="results" class="list" hidden></div>
    </section>

    <section id="tab-created" aria-label="Entries nexus-menu created" hidden>
      <p id="created-summary" class="muted"></p>
      <div id="created-list" class="list"></div>
      <div class="actions">
        <span id="created-count" class="muted"></span>
        <button type="button" id="remove" class="danger" disabled>Remove selected</button>
      </div>
      <div id="remove-results" class="list" hidden></div>
    </section>

    <section id="tab-prefixes" aria-label="Wine prefixes" hidden>
      <p id="prefix-summary" class="muted"></p>
      <div id="prefix-list" class="list"></div>
    </section>
  </main>

  <div id="busy" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <span id="busy-text">Working</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
