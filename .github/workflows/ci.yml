name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  # The minimum Rust version in Cargo.toml is a promise to users. Without this
  # job it silently rots: it was once stated as 1.74 while the locked
  # dependencies needed 1.85, and nothing noticed. Cargo.toml is the single
  # source of truth, so raising or lowering `rust-version` there changes what
  # this job enforces, and a dependency bump that outgrows it fails here.
  msrv:
    name: builds on the declared minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "minimum supported Rust version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install that toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal

      # --locked builds the exact dependency versions users get from Cargo.lock,
      # which is what decides the real minimum.
      - name: Build and test on it
        run: cargo "+${{ steps.msrv.outputs.version }}" test --locked

  validate:
    name: generated entries pass desktop-file-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install desktop-file-utils
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils

      - name: Build
        run: cargo build --release

      # Render an entry for EVERY template, not just the ones that happen to
      # be installed on the runner. `create --force` bypasses the
      # already-has-an-entry check, so this proves no template in the catalog
      # can produce a non-conforming entry.
      - name: Render an entry for every catalog template
        run: |
          set -euo pipefail
          mkdir -p /tmp/entries /tmp/stubbin

          ./target/release/nexus-menu catalog \
            | sed -n 's/^  \([^ ]\+\) .*/\1/p' > /tmp/bins.txt
          expected=$(wc -l < /tmp/bins.txt)
          echo "catalog advertises $expected templates"
          test "$expected" -gt 0

          # Stub executable per catalogued binary so each resolves on $PATH.
          while read -r bin; do
            [ -n "$bin" ] || continue
            printf '#!/bin/sh\nexit 0\n' > "/tmp/stubbin/$bin"
            chmod +x "/tmp/stubbin/$bin"
          done < /tmp/bins.txt

          PATH="/tmp/stubbin:$PATH" ./target/release/nexus-menu \
            --dir /tmp/entries create --force $(tr '\n' ' ' < /tmp/bins.txt)

          actual=$(ls -1 /tmp/entries/*.desktop | wc -l)
          echo "rendered $actual entries"
          test "$actual" -eq "$expected"

      # desktop-file-validate exits 0 for hints and warnings, so treat any
      # output at all as a failure.
      - name: Validate every generated entry
        run: |
          set -euo pipefail
          output=$(desktop-file-validate /tmp/entries/*.desktop 2>&1 || true)
          if [ -n "$output" ]; then
            echo "desktop-file-validate reported problems:"
            echo "$output"
            exit 1
          fi
          echo "all entries valid: no errors, warnings, or hints"

      # The tool's own launcher is hand-written, so it needs the same scrutiny
      # as the generated ones — both as committed and as `make install-launcher`
      # rewrites it, which is the form users actually get.
      - name: Validate the shipped launcher
        run: |
          set -euo pipefail
          make install-launcher DESTDIR=/tmp/stage PREFIX=/usr
          installed=/tmp/stage/usr/share/applications/nexus-menu.desktop
          output=$(desktop-file-validate desktop/nexus-menu.desktop "$installed" 2>&1 || true)
          if [ -n "$output" ]; then
            echo "desktop-file-validate reported problems:"
            echo "$output"
            exit 1
          fi

          # The rewrite is a sed over a file that is free to change; prove it
          # still produced absolute paths rather than silently matching nothing.
          grep -q '^TryExec=/usr/bin/nexus-menu$' "$installed"
          test "$(grep -c 'sh -c "/usr/bin/nexus-menu ' "$installed")" -eq 4
          test -f /tmp/stage/usr/share/icons/hicolor/scalable/apps/nexus-menu.svg
          echo "launcher valid and correctly rewritten"
