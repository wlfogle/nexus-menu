name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    name: Build and publish
    # Pinned, like the desktop app's job below, because `ubuntu-latest` is about
    # to move to a newer Ubuntu and a release should not depend on what the
    # label happens to mean that week. The binary is statically linked against
    # musl, so the host release does not change what ships.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the manifest produces an artifact whose
      # --version output contradicts its own filename. Refuse to publish it.
      - name: Verify tag matches Cargo.toml
        run: |
          set -euo pipefail
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tagged="${{ steps.version.outputs.version }}"
          echo "manifest=$manifest tag=$tagged"
          if [ "$manifest" != "$tagged" ]; then
            echo "::error::Cargo.toml says $manifest but the tag says $tagged"
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"

      - name: Test
        run: cargo test

      - name: Build static binary
        run: cargo build --release --locked --target "$TARGET"

      # The whole point of the musl target here is an artifact that runs on
      # any x86_64 Linux regardless of glibc version. Prove it is static.
      - name: Verify the binary is statically linked
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/nexus-menu"
          file "$bin"
          if ! file "$bin" | grep -q "static"; then
            echo "::error::binary is not statically linked"
            exit 1
          fi
          "$bin" --version

      - name: Validate every catalog template
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
          bin="$PWD/target/$TARGET/release/nexus-menu"
          mkdir -p /tmp/entries /tmp/stubbin
          "$bin" catalog | sed -n 's/^  \([^ ]\+\) .*/\1/p' > /tmp/bins.txt
          while read -r b; do
            [ -n "$b" ] || continue
            printf '#!/bin/sh\nexit 0\n' > "/tmp/stubbin/$b"
            chmod +x "/tmp/stubbin/$b"
          done < /tmp/bins.txt
          PATH="/tmp/stubbin:$PATH" "$bin" --dir /tmp/entries \
            create --force $(tr '\n' ' ' < /tmp/bins.txt)
          out=$(desktop-file-validate /tmp/entries/*.desktop 2>&1 || true)
          if [ -n "$out" ]; then
            echo "::error::desktop-file-validate reported problems"
            echo "$out"
            exit 1
          fi
          echo "all $(ls -1 /tmp/entries/*.desktop | wc -l) entries valid"

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          name="nexus-menu-$version-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/nexus-menu" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md Makefile "dist/$name/"
          # Ship the launcher and its icon so `make install-launcher` works
          # straight out of the archive, without a checkout or a toolchain.
          cp -r desktop "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$name.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "${{ steps.package.outputs.archive }}" \
              "${{ steps.package.outputs.checksum }}" --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file .github/release-notes.md \
              "${{ steps.package.outputs.archive }}" \
              "${{ steps.package.outputs.checksum }}"
          fi

  # The desktop app. It is a plain dynamically linked binary that uses the
  # system's webkit2gtk, so it is built on the oldest Ubuntu LTS that has
  # webkit2gtk-4.1, which keeps its glibc requirement as low as it can be.
  #
  # It is signed, and installed copies check that signature before updating
  # themselves. scripts/release-gui.sh therefore refuses to produce anything
  # they would reject: a wrong version, a binary built with the update test
  # hooks, or a signing key that is not the one compiled into the app.
  gui:
    name: Build, sign and publish the desktop app
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Values from the event and from secrets reach the shell through the
      # environment, never spliced into the script text.
      - name: Check the signing key is configured
        env:
          KEY: ${{ secrets.NEXUS_MENU_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::the NEXUS_MENU_SIGNING_KEY secret is not set; see CONTRIBUTING.md, \"Releasing the desktop app\""
            exit 1
          fi

      - name: Install the system packages Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Test
        working-directory: gui
        run: cargo test --locked

      - name: Build
        working-directory: gui
        run: cargo build --release --locked

      - name: Install rsign
        run: cargo install rsign2 --locked --version 0.6.7

      - name: Sign and stage
        env:
          KEY: ${{ secrets.NEXUS_MENU_SIGNING_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$KEY" > "$keyfile"
          NEXUS_MENU_SIGNING_KEY_FILE="$keyfile" bash scripts/release-gui.sh "$TAG" dist-gui

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist-gui/* --clobber
